plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.resttimernotification'
version = '0.1.0'

android {
  namespace "expo.modules.resttimernotification"
  defaultConfig {
    minSdkVersion 24
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
}
